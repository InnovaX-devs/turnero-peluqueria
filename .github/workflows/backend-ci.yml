name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build:
    name: Build y tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Base de datos para los tests (mismos datos que el perfil dev)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: barberia_test
          POSTGRES_USER: barberia
          POSTGRES_PASSWORD: barberia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U barberia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Dar permisos a mvnw
        run: chmod +x mvnw

      - name: Compilar y correr tests
        run: ./mvnw -B verify
