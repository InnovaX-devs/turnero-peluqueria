services:
  db:
    image: postgres:16
    container_name: barberia-db
    environment:
      POSTGRES_DB: ${DB_NAME:-barberia}
      POSTGRES_USER: ${DB_USER:-barberia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-barberia}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
