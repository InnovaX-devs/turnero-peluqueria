# Solo para tests: siempre contra el Postgres local de Docker (barberia-db), nunca contra Supabase.
# Pisa a application.yml (los .properties tienen prioridad sobre los .yml).
# Perfil propio: así no se activa "local" (que apunta a la base barberia, no a barberia_test).
spring.profiles.active=test
spring.datasource.url=jdbc:postgresql://localhost:5432/barberia_test
spring.datasource.username=barberia
spring.datasource.password=barberia
# Los tests usan los datos de prueba (admin@jade.com, barbería Jade, etc.)
spring.flyway.locations=classpath:db/migration,classpath:db/seed
app.jwt.secret=secreto-solo-para-tests-0123456789-abcdefghij

# Los tests nunca mandan emails de verdad, aunque el .env tenga RESEND_API_KEY
app.mail.resend-api-key=