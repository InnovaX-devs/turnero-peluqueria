spring:
  application:
    name: barberia
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # el esquema lo maneja Flyway, nunca Hibernate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC   # todas las fechas se guardan en UTC
  flyway:
    enabled: true

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}          # obligatorio, mínimo 32 caracteres
    expiracion: ${JWT_EXPIRACION:8h}
  cors:
    origenes: ${CORS_ORIGENES:http://localhost:5173}
