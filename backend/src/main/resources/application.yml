spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: barberia

  # Sin .env (o con SPRING_PROFILES_ACTIVE=local) se usa el Docker local con datos de prueba.
  # Con SPRING_PROFILES_ACTIVE=dev en el .env se usa Supabase (DB_HOST, DB_USER, etc.).
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  # Fotos de barberos: Spring corta en 1 MB por defecto, el código permite hasta 5 MB
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}

# Issue #73: los logs no pueden llevar datos de pacientes (DNI, cobertura, notas).
# Hibernate no imprime SQL ni valores de parámetros: no subir estos niveles en producción.
logging:
  level:
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET}
    expiracion: ${JWT_EXPIRACION:8h}


  mail:
    resend-api-key: ${RESEND_API_KEY:}
    remitente: ${MAIL_REMITENTE:}
    # Solo para desarrollo: sin RESEND_API_KEY, imprime el cuerpo completo del email en el log.
    # Dejarlo en false en producción: tiene datos de pacientes y links de recuperación (issue #73).
    log-contenido: ${MAIL_LOG_CONTENIDO:false}

  cors:
    origenes: ${CORS_ORIGENES:http://localhost:5173}

  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  
  storage:
    supabase-url: ${SUPABASE_URL:}
    service-key: ${SUPABASE_SERVICE_KEY:}
    bucket: ${SUPABASE_BUCKET:fotos-barberos}
