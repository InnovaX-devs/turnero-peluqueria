spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:barberia}
    username: ${DB_USER:barberia}
    password: ${DB_PASSWORD:barberia}
  jpa:
    show-sql: true
  flyway:
    # en dev también se cargan los datos de prueba
    locations: classpath:db/migration,classpath:db/seed

app:
  jwt:
    # solo para desarrollo; en producción se usa la variable JWT_SECRET
    secret: ${JWT_SECRET:dev-secret-solo-para-desarrollo-local-123456}
